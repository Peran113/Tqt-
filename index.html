*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#0d0d14;color:#e2e2f0;min-height:100vh}
header{padding:18px;background:linear-gradient(135deg,#0d0d14,#16163a);text-align:center;border-bottom:1px solid #252535}
h1{font-size:22px;font-weight:800;background:linear-gradient(90deg,#6c63ff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{font-size:12px;color:#6b6b85;margin-top:3px}
.bar{padding:12px;background:#10101a;border-bottom:1px solid #1e1e30;position:sticky;top:0;z-index:100}
.search{width:100%;padding:9px 14px;border-radius:10px;border:1px solid #252535;background:#1a1a28;color:#e2e2f0;font-size:13px;font-family:inherit;margin-bottom:8px}
.search:focus{outline:none;border-color:#6c63ff}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.fb{padding:4px 12px;border-radius:20px;border:1px solid #252535;background:#1a1a28;color:#6b6b85;font-size:10px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.fb:hover,.fb.active{background:#6c63ff;color:#fff;border-color:#6c63ff}
.cnt{font-size:10px;color:#6b6b85;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;padding:12px}
.card{background:#16161f;border:1px solid #252535;border-radius:12px;overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#6c63ff}
.iw{width:100%;height:118px;background:#0d0d18;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.iw img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;opacity:0;transition:opacity .2s}
.iw img.loaded{opacity:1}
.cons{position:absolute;top:4px;left:4px;background:rgba(108,99,255,.9);color:#fff;font-size:8px;padding:2px 6px;border-radius:8px;z-index:2;font-weight:600}
.bd{padding:8px 10px}
.tt{font-size:10.5px;font-weight:600;line-height:1.3;min-height:28px;margin-bottom:5px;color:#e2e2f0}
.pr{display:flex;justify-content:space-between;font-size:9.5px;margin-bottom:2px}
.pl{color:#6b6b85}
.pv{font-weight:600;color:#c8c8f0}
.buy{margin-top:5px;padding-top:5px;border-top:1px solid #252535;font-size:9.5px;color:#22c55e;font-weight:700}

const RAWG_KEY = "0a1c73b0581d416d9853279817dde520";

const CONS_COLORS={
  "Game Boy":"#8b5cf6","GBA":"#7c3aed","SNES":"#6d28d9","NES":"#dc2626",
  "N64":"#2563eb","GameCube":"#7c3aed","DS":"#0891b2","3DS":"#0284c7",
  "Wii":"#6366f1","Wii U":"#0ea5e9","Switch":"#e11d48","Switch 2":"#dc2626",
  "PS1":"#1d4ed8","PS2":"#1e40af","PS5":"#1e3a8a","PSP/Vita":"#0f172a"
};

function makeSvgPlaceholder(name,cons){
  const col=CONS_COLORS[cons]||"#6c63ff";
  const words=name.split(" ");
  const lines=[];let cur="";
  words.forEach(w=>{if((cur+" "+w).trim().length>14&&cur){lines.push(cur.trim());cur=w;}else{cur=(cur+" "+w).trim();}});
  if(cur)lines.push(cur.trim());
  const mid=lines.map((l,i)=>`<text x="50%" y="${50+(i-(lines.length-1)/2)*18}%" dominant-baseline="middle" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="sans-serif">${l}</text>`).join("");
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${col}"/><stop offset="100%" stop-color="${col}88"/></linearGradient></defs><rect width="300" height="220" fill="url(#g)"/><rect x="10" y="10" width="280" height="200" rx="8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>${mid}</svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

const _cache = JSON.parse(localStorage.getItem("rg_img")||"{}");
const STRIP = /\b(Game Boy|GBA|SNES|NES|N64|GameCube|DS|3DS|Wii U|Wii|Switch 2|Switch|PS1|PS2|PS5|PSP|Vita|GB|GBC|Original|Pocket|Micro|console|HD|3D|DX|Deluxe|Ultimate)\b/gi;

async function rawgImg(name){
  if(_cache[name]!==undefined)return _cache[name];
  const q=name.replace(STRIP,"").replace(/\s+/g," ").trim();
  try{
    const key=RAWG_KEY?`&key=${RAWG_KEY}`:"";
    const r=await fetch(`https://api.rawg.io/api/games?search=${encodeURIComponent(q)}&page_size=1${key}`);
    const d=await r.json();
    const img=d.results?.[0]?.background_image||null;
    _cache[name]=img;
    localStorage.setItem("rg_img",JSON.stringify(_cache));
    return img;
  }catch(e){_cache[name]=null;return null;}
}

const observer=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      observer.unobserve(e.target);
      const el=e.target;
      const name=el.dataset.name;
      const cons=el.dataset.cons;
      rawgImg(name).then(url=>{
        if(url){el.src=url;el.onload=()=>el.classList.add("loaded");}
        else{el.src=makeSvgPlaceholder(name,cons);el.classList.add("loaded");}
      });
    }
  });
},{rootMargin:"150px"});

const cons=["Tous",...[...new Set(G.map(g=>g.c))]];
let active="Tous";
const filEl=document.getElementById("fil");
cons.forEach(c=>{
  const b=document.createElement("button");
  b.className="fb"+(c==="Tous"?" active":"");
  b.textContent=c;
  b.onclick=()=>{active=c;document.querySelectorAll(".fb").forEach(x=>x.classList.remove("active"));b.classList.add("active");render();};
  filEl.appendChild(b);
});

function buy(p){if(!p)return null;return(p/2).toFixed(2)+"€ – "+(p/1.5).toFixed(2)+"€";}

function render(){
  const q=document.getElementById("s").value.toLowerCase();
  const fil=G.filter(g=>(active==="Tous"||g.c===active)&&g.n.toLowerCase().includes(q));
  document.getElementById("cnt").textContent=fil.length+" résultats";
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  fil.forEach(g=>{
    const p=g.full||g.cart;
    const b=buy(p);
    const d=document.createElement("div");
    d.className="card";
    d.innerHTML=`<div class="iw">
      <img data-name="${g.n.replace(/"/g,'&quot;')}" data-cons="${g.c}" alt="${g.n}" src="${makeSvgPlaceholder(g.n,g.c)}">
      <span class="cons">${g.c}</span>
    </div>
    <div class="bd">
      <div class="tt">${g.n}</div>
      ${g.cart?`<div class="pr"><span class="pl">Cartouche</span><span class="pv">${g.cart}€</span></div>`:""}
      ${g.full?`<div class="pr"><span class="pl">Complet</span><span class="pv">${g.full}€</span></div>`:""}
      ${b?`<div class="buy">💰 Acheter: ${b}</div>`:""}
    </div>`;
    grid.appendChild(d);
    observer.observe(d.querySelector("img"));
  });
}
render();
</script>
